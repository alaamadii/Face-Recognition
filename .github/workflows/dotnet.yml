name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FaceRecognition.slnx

      - name: Verify formatting
        run: dotnet format FaceRecognition.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build FaceRecognition.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FaceRecognition.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
